; Common configuration for both bots
[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:auto_commit.py

; Libraries for WebSocket server and filesystem
lib_deps = 
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit NeoPixel@^1.12.0
    madhephaestus/ESP32Servo@^3.0.5

; Base build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; Upload filesystem to data folder
board_build.filesystem = littlefs

; =============================================================================
; Bot-specific environments - Select from PlatformIO dropdown
; =============================================================================

[env:pachavandi]
build_flags = 
    ${env.build_flags}
    -D BOT_PACHAVANDI

[env:neelavandi]
build_flags = 
    ${env.build_flags}
    -D BOT_NEELAVANDI

