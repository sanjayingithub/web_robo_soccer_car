<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Robo Soccer Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
        }

        .status.waiting {
            background: #fff3cd;
            color: #856404;
        }

        .status.denied {
            background: #f8d7da;
            color: #721c24;
        }

        .queue-info {
            text-align: center;
            margin: 10px 0;
            color: #666;
            font-size: 14px;
        }

        .joystick-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .joystick-label {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }

        #joystick {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #f0f0f0 0%, #d0d0d0 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
            border: 3px solid #999;
            cursor: pointer;
            touch-action: none;
        }

        .joystick-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 15px;
            height: 15px;
            background: #666;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.3;
        }

        .joystick-stick {
            position: absolute;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: all 0.1s ease;
        }

        #kickButton {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
            margin-top: 20px;
            touch-action: manipulation;
            transition: all 0.2s ease;
        }

        #kickButton:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.3);
        }

        #kickButton:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .nickname-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .nickname-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .nickname-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .nickname-box input {
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 8px;
            width: 100%;
            max-width: 250px;
            margin-bottom: 15px;
        }

        .nickname-box button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .coords {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Robo Soccer Bot</h1>
        
        <div id="statusMessage" class="status"></div>
        <div id="queueInfo" class="queue-info"></div>
        
        <div class="joystick-container">
            <div class="joystick-label">Movement Control</div>
            <div id="joystick">
                <div class="joystick-center"></div>
                <div class="joystick-stick" id="stick"></div>
            </div>
            <div class="coords" id="coords">X: 0, Y: 0</div>
        </div>
        
        <button id="kickButton" disabled>⚽ KICK</button>
    </div>

    <div class="nickname-prompt" id="nicknamePrompt">
        <div class="nickname-box">
            <h2>Enter Your Nickname</h2>
            <input type="text" id="nicknameInput" placeholder="Your Name" maxlength="10" autocomplete="off">
            <br>
            <button onclick="submitNickname()">Join Game</button>
        </div>
    </div>

    <script src="/controller.js"></script>
</body>
</html>
